name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-packages --extra pdf   # PyMuPDF, so the PDF/OCR tests run
      - run: uv run pytest

  lint-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-packages --extra pdf
      - run: uv run ruff check .          # errors, likely bugs and import order (see pyproject.toml)
      - run: uv run mypy                  # type-check the core packages (see pyproject.toml)
      - run: uv run pip-audit --skip-editable   # known vulnerabilities in installed dependencies
