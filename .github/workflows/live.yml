name: live

# Real calls to Gemini once a day (and on demand), to catch provider-side changes that the
# offline tests cannot see. Costs a fraction of a cent per run. Add the repository secret
# GOOGLE_API_KEY (Settings > Secrets and variables > Actions) to enable it; without it the
# job skips.

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      LLMGW_LOG: "0"
    steps:
      - name: Skip when no key is configured
        if: env.GOOGLE_API_KEY == ''
        run: echo "GOOGLE_API_KEY secret not set; skipping live checks."
      - uses: actions/checkout@v4
        if: env.GOOGLE_API_KEY != ''
      - uses: astral-sh/setup-uv@v6
        if: env.GOOGLE_API_KEY != ''
        with:
          python-version: "3.12"
          enable-cache: true
      - if: env.GOOGLE_API_KEY != ''
        run: uv sync --locked --all-packages
      - if: env.GOOGLE_API_KEY != ''
        run: uv run python scripts/smoke_live.py --providers gemini
