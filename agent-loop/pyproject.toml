[project]
name = "agent-loop"
version = "0.2.0"
description = "A minimal, fully visible tool-calling agent loop with JSONL traces and an HTML trace viewer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["llm-gateway"]

[project.scripts]
agentloop = "agentloop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentloop"]

[tool.uv.sources]
llm-gateway = { workspace = true }
