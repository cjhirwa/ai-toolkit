[project]
name = "embedding-viz"
version = "0.2.0"
description = "Map your corpus: 2-D embedding plots, clusters, near-duplicate detection and query coverage gaps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["retrieval-kit", "numpy>=1.26", "plotly>=5.22"]

[project.optional-dependencies]
umap = ["umap-learn>=0.5"]
sklearn = ["scikit-learn>=1.5"]

[project.scripts]
embviz = "embviz.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embviz"]

[tool.uv.sources]
retrieval-kit = { workspace = true }
