[project]
name = "synth-data"
version = "0.2.0"
description = "Generate, critique and deduplicate Q&A eval sets (and retrieval qrels) from your own chunks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["llm-gateway"]

[project.scripts]
synthdata = "synthdata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthdata"]

[tool.uv.sources]
llm-gateway = { workspace = true }
