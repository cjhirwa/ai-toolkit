[project]
name = "structured-extract"
version = "0.2.0"
description = "Documents -> validated Pydantic objects. Long-document chunk-and-merge, batch over files, JSONL/CSV export."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["llm-gateway", "doc-ingest"]

[project.scripts]
sextract = "sextract.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sextract"]

[tool.uv.sources]
llm-gateway = { workspace = true }
doc-ingest = { workspace = true }
