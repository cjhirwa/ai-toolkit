[project]
name = "guardrails-router"
version = "0.2.0"
description = "Classify incoming queries (scope, safety, intent, language) with a cheap-to-expensive cascade and route them to handlers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["llm-gateway", "numpy>=1.26", "pyyaml>=6"]

[project.scripts]
qroute = "qroute.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qroute"]

[tool.uv.sources]
llm-gateway = { workspace = true }
