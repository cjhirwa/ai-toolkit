[project]
name = "eval-harness"
version = "0.2.0"
description = "Run any pipeline over a dataset, score it with rule-based and LLM-judge metrics, store runs in SQLite and compare them."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["llm-gateway"]

[project.scripts]
evalh = "evalh.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalh"]

[tool.uv.sources]
llm-gateway = { workspace = true }
