[project]
name = "retrieval-kit"
version = "0.2.0"
description = "BM25 + dense + hybrid (RRF) retrieval with rerankers, query rewriting/HyDE and a benchmark runner."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["llm-gateway", "numpy>=1.26"]

[project.optional-dependencies]
cross-encoder = ["sentence-transformers>=3.0"]
chroma = ["chromadb>=0.5"]

[project.scripts]
retrievekit = "retrievekit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrievekit"]

[tool.uv.sources]
llm-gateway = { workspace = true }
