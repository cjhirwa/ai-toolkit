[project]
name = "speech-tools"
version = "0.2.0"
description = "Speech-to-text (Gemini / OpenAI / local Whisper) and glossary-aware translation with back-translation checks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["llm-gateway"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]

[project.scripts]
speechkit = "speechkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speechkit"]

[tool.uv.sources]
llm-gateway = { workspace = true }
