[project]
name = "playground"
version = "0.2.0"
description = "Streamlit playground: compare models, prompts and settings side by side, on one input or a dataset."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.38", "pandas>=2.2", "llm-gateway[all]", "prompt-registry"]

[project.scripts]
playground = "playground.launch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playground"]

[tool.uv.sources]
llm-gateway = { workspace = true }
prompt-registry = { workspace = true }
