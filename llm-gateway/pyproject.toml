[project]
name = "llm-gateway"
version = "0.2.0"
description = "One client over Gemini, OpenAI and Ollama: retries, structured output, tools, cost tracking, call logs and caching."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.30"]
openai = ["openai>=1.40"]
all = ["google-genai>=1.30", "openai>=1.40"]
otel = ["opentelemetry-api>=1.20"]   # spans per call; no-op until an OpenTelemetry SDK is configured

[project.scripts]
llmgw = "llmgw.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmgw"]
