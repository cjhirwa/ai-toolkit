[project]
name = "prompt-registry"
version = "0.2.0"
description = "Versioned prompt templates in YAML with Jinja2 rendering, diffs and a CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jinja2>=3.1"]

[project.scripts]
promptreg = "promptreg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptreg"]
